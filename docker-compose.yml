version: '3.8'

services:

  db:
    image: mysql:8.0
    container_name: marketplace_db
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: sislog
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: marketplace_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/sislog
    stdin_open: true
    tty: true
    volumes:
      - ./config.properties:/app/config.properties

volumes:
  db_data: